name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(python3 -c 'import sys; sys.path.insert(0, "src"); import xo_inventory; print(xo_inventory.__version__)')
          deb=$(dpkg-parsechangelog -S Version)
          echo "tag=$tag code=$code debian=$deb"
          test "$tag" = "$code" || { echo "::error::Tag $GITHUB_REF_NAME does not match xo_inventory.__version__ ($code)"; exit 1; }
          test "$tag" = "$deb" || { echo "::error::Tag $GITHUB_REF_NAME does not match debian/changelog ($deb)"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        run: |
          # The section of CHANGELOG.md for this version, without its heading.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG.md section for ${GITHUB_REF_NAME#v}"; exit 1; }
          cat notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          fail_on_unmatched_files: true
